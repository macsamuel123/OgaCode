<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nigerian Expense Tracker</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #121212;
    color: #e0e0e0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 20px;
  }
  .container { max-width: 700px; width: 100%; }
  h1 {
    text-align: center;
    color: #00c853;
    margin: 20px 0;
    font-size: 2rem;
  }
  h1 span { color: #ffd600; }
  h2 {
    color: #bbbbbb;
    margin: 20px 0 10px;
    font-size: 1.3rem;
    border-bottom: 1px solid #333;
    padding-bottom: 6px;
  }
  .card {
    background: #1e1e1e;
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.4);
  }
  .form-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
  }
  .form-row input, .form-row select {
    background: #2a2a2a;
    border: 1px solid #444;
    color: #e0e0e0;
    padding: 10px 12px;
    border-radius: 6px;
    font-size: 0.95rem;
    flex: 1;
    min-width: 120px;
  }
  .form-row input:focus, .form-row select:focus {
    outline: none;
    border-color: #00c853;
  }
  .form-row button {
    background: #00c853;
    color: #000;
    border: none;
    padding: 10px 20px;
    border-radius: 6px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  .form-row button:hover { background: #00e676; }
  .amount-prefix {
    display: flex;
    align-items: center;
    background: #2a2a2a;
    border: 1px solid #444;
    border-radius: 6px;
    overflow: hidden;
    flex: 1;
    min-width: 120px;
  }
  .amount-prefix span {
    background: #333;
    padding: 10px 10px;
    color: #ffd600;
    font-weight: 600;
    font-size: 0.95rem;
  }
  .amount-prefix input {
    border: none;
    background: transparent;
    color: #e0e0e0;
    padding: 10px 12px;
    font-size: 0.95rem;
    flex: 1;
    min-width: 60px;
  }
  .amount-prefix input:focus { outline: none; }
  .expense-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 0;
    border-bottom: 1px solid #2a2a2a;
  }
  .expense-item:last-child { border-bottom: none; }
  .expense-info { flex: 1; }
  .expense-desc {
    font-weight: 500;
    margin-bottom: 2px;
  }
  .expense-meta {
    font-size: 0.8rem;
    color: #888;
  }
  .expense-amount {
    font-weight: 600;
    color: #ffd600;
    margin-right: 15px;
    white-space: nowrap;
  }
  .expense-actions button {
    background: #d32f2f;
    color: #fff;
    border: none;
    padding: 6px 12px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 0.8rem;
  }
  .expense-actions button:hover { background: #f44336; }
  .empty-msg {
    text-align: center;
    color: #666;
    padding: 20px;
    font-style: italic;
  }
  .summary-grid {
    display: grid;
    gap: 12px;
  }
  .summary-item {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .summary-header {
    display: flex;
    justify-content: space-between;
    font-size: 0.9rem;
  }
  .summary-cat { color: #aaa; }
  .summary-val { color: #ffd600; font-weight: 600; }
  .progress-bar {
    height: 12px;
    background: #2a2a2a;
    border-radius: 6px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    border-radius: 6px;
    transition: width 0.4s ease;
  }
  .total-row {
    display: flex;
    justify-content: space-between;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid #333;
    font-size: 1.1rem;
    font-weight: 600;
  }
  .total-row .total-label { color: #bbb; }
  .total-row .total-val { color: #00c853; }
  .toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: #333;
    color: #fff;
    padding: 12px 24px;
    border-radius: 8px;
    font-size: 0.9rem;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
    z-index: 999;
  }
  .toast.show { opacity: 1; }
  .loading { text-align: center; color: #666; padding: 10px; }
</style>
</head>
<body>
<div class="container">
  <h1>🇳🇬 <span>Naira</span>Tracker</h1>

  <div class="card">
    <h2>Add Expense</h2>
    <div class="form-row">
      <input type="text" id="desc" placeholder="Description (e.g. Danfo bus)" />
      <div class="amount-prefix">
        <span>₦</span>
        <input type="number" id="amount" placeholder="Amount" min="1" step="0.01" />
      </div>
      <select id="category">
        <option value="Food">Food</option>
        <option value="Transport">Transport</option>
        <option value="Data">Data</option>
        <option value="Electricity">Electricity</option>
        <option value="Entertainment">Entertainment</option>
        <option value="Other">Other</option>
      </select>
      <button id="addBtn">Add</button>
    </div>
  </div>

  <div class="card">
    <h2>Monthly Summary</h2>
    <div id="summaryContainer">
      <div class="loading">Loading summary...</div>
    </div>
  </div>

  <div class="card">
    <h2>All Expenses</h2>
    <div id="expensesContainer">
      <div class="loading">Loading expenses...</div>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
const API = '/api/expenses';

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

async function apiFetch(method, body) {
  const opts = { method, headers: { 'Content-Type': 'application/json' } };
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch(API, opts);
  return res.json();
}

async function loadExpenses() {
  const res = await fetch(API);
  return res.json();
}

async function deleteExpense(id) {
  const res = await fetch(`${API}/${id}`, { method: 'DELETE' });
  return res.json();
}

function renderExpenses(expenses) {
  const container = document.getElementById('expensesContainer');
  if (!expenses || expenses.length === 0) {
    container.innerHTML = '<div class="empty-msg">No expenses yet. Start tracking!</div>';
    return;
  }
  let html = '';
  expenses.forEach(e => {
    html += `
      <div class="expense-item">
        <div class="expense-info">
          <div class="expense-desc">${escapeHtml(e.description)}</div>
          <div class="expense-meta">${escapeHtml(e.category)}</div>
        </div>
        <div class="expense-amount">₦${formatAmount(e.amount)}</div>
        <div class="expense-actions">
          <button onclick="handleDelete(${e.id})">Delete</button>
        </div>
      </div>
    `;
  });
  container.innerHTML = html;
}

function renderSummary(expenses) {
  const container = document.getElementById('summaryContainer');
  if (!expenses || expenses.length === 0) {
    container.innerHTML = '<div class="empty-msg">No data for this month.</div>';
    return;
  }

  const cats = {};
  const catColors = {
    Food: '#ff5722',
    Transport: '#2196f3',
    Data: '#9c27b0',
    Electricity: '#ff9800',
    Entertainment: '#e91e63',
    Other: '#607d8b'
  };
  let total = 0;

  expenses.forEach(e => {
    cats[e.category] = (cats[e.category] || 0) + e.amount;
    total += e.amount;
  });

  let html = '<div class="summary-grid">';
  const catOrder = ['Food', 'Transport', 'Data', 'Electricity', 'Entertainment', 'Other'];
  catOrder.forEach(cat => {
    const val = cats[cat] || 0;
    const pct = total > 0 ? (val / total * 100) : 0;
    const color = catColors[cat] || '#607d8b';
    html += `
      <div class="summary-item">
        <div class="summary-header">
          <span class="summary-cat">${cat}</span>
          <span class="summary-val">₦${formatAmount(val)}</span>
        </div>
        <div class="progress-bar">
          <div class="progress-fill" style="width:${pct.toFixed(1)}%;background:${color}"></div>
        </div>
      </div>
    `;
  });
  html += '</div>';
  html += `<div class="total-row"><span class="total-label">Total</span><span class="total-val">₦${formatAmount(total)}</span></div>`;
  container.innerHTML = html;
}

function formatAmount(n) {
  return Number(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

async function refreshAll() {
  try {
    const expenses = await loadExpenses();
    renderExpenses(expenses);
    renderSummary(expenses);
  } catch (e) {
    document.getElementById('expensesContainer').innerHTML = '<div class="empty-msg">Error loading expenses. Is the server running?</div>';
    document.getElementById('summaryContainer').innerHTML = '<div class="empty-msg">Error loading summary.</div>';
  }
}

async function handleDelete(id) {
  try {
    await deleteExpense(id);
    showToast('Expense deleted');
    refreshAll();
  } catch (e) {
    showToast('Error deleting expense');
  }
}

document.getElementById('addBtn').addEventListener('click', async () => {
  const desc = document.getElementById('desc').value.trim();
  const amount = document.getElementById('amount').value.trim();
  const category = document.getElementById('category').value;

  if (!desc) { showToast('Please enter a description'); return; }
  if (!amount || parseFloat(amount) <= 0) { showToast('Please enter a valid amount'); return; }

  try {
    await apiFetch('POST', { description: desc, amount: parseFloat(amount), category });
    showToast('Expense added!');
    document.getElementById('desc').value = '';
    document.getElementById('amount').value = '';
    refreshAll();
  } catch (e) {
    showToast('Error adding expense');
  }
});

refreshAll();
</script>
</body>
</html>
